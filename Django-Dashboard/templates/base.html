<!-- {% load static %}  -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block metadescription %}{% endblock %}">
    <title>
        {% block title %}
        {% endblock title %}
    </title>
    {% block links %}
    <!-- Modern custom style -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% endblock links %}
    <!-- this link to request icons from fontawsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,700;0,800;1,500&display=swap');
        body {
            background: #f4f6fb;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            color: #222;
        }
        .navbar {
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar .brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: #2d6cdf;
            letter-spacing: 1px;
        }
        .navbar ul {
            list-style: none;
            display: flex;
            gap: 1.5rem;
            margin: 0;
            padding: 0;
        }
        .navbar ul li a {
            text-decoration: none;
            color: #222;
            font-weight: 500;
            transition: color 0.2s;
        }
        .navbar ul li a:hover {
            color: #2d6cdf;
        }
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
        }
        .btn {
            background: #2d6cdf;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0.7rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1a4fa0;
        }
        @media (max-width: 700px) {
            .container {
                padding: 1rem;
            }
            .navbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <span class="brand"><i class="fa-brands fa-twitter"></i> Twitter Sentiment Dashboard</span>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/dashboard/">Dashboard</a></li>
            <li><a href="/about/">About</a></li>
        </ul>
    </nav>
    <div class="container">
        {% block content %}
        {% endblock content %}
    </div>
    {% block scripts %}
    {% endblock scripts %}
</body>
</html>
